name: SensorPush data

# Pulls SensorPush readings and force-pushes them as a single commit to the
# orphan branch `sensorpush-data`. The dashboard (index.html) reads that file
# from raw.githubusercontent.com, so main's history never grows.
on:
  schedule:
    # Off-the-hour minutes: GitHub drops :00 runs first when its scheduler is busy.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Also send a test push to the ntfy topic"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sensorpush-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Send test alert
        if: ${{ inputs.test_alert }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::error::NTFY_TOPIC secret is not set, so heat alerts can't reach a phone."; exit 1
          fi
          curl -fsS -H "Title: Test from your home dashboard" -H "Priority: high" \
            -H "Tags: white_check_mark" -H "Click: https://home.esemay.com" \
            -d "If you can read this, no-heat alerts from the dashboard will reach your phone." \
            "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          echo "Test alert sent."

      # Previous file, so Nest (which has no history API) can keep a rolling log.
      # With WORKER_URL set (repo variable), data lives in the private Worker;
      # otherwise in the public sensorpush-data branch.
      - name: Get previous data
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -n "$WORKER_URL" ]; then
            curl -fsS -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              "$WORKER_URL/data/latest.json" -o "$RUNNER_TEMP/prev.json" || echo "no previous data in Worker"
          else
            git fetch -q --depth=1 origin sensorpush-data && \
              git show FETCH_HEAD:latest.json > "$RUNNER_TEMP/prev.json" || echo "no previous data"
          fi

      - name: Fetch from SensorPush and Nest
        env:
          SENSORPUSH_EMAIL: ${{ secrets.SENSORPUSH_EMAIL }}
          SENSORPUSH_PASSWORD: ${{ secrets.SENSORPUSH_PASSWORD }}
          NEST_PROJECT_ID: ${{ secrets.NEST_PROJECT_ID }}
          NEST_CLIENT_ID: ${{ secrets.NEST_CLIENT_ID }}
          NEST_CLIENT_SECRET: ${{ secrets.NEST_CLIENT_SECRET }}
          NEST_REFRESH_TOKEN: ${{ secrets.NEST_REFRESH_TOKEN }}
          PREV_JSON: ${{ runner.temp }}/prev.json
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 scripts/fetch_sensorpush.py "$RUNNER_TEMP/out/latest.json"

      - name: Publish to private Worker
        if: ${{ vars.WORKER_URL != '' }}
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          curl -fsS -X PUT -H "Content-Type: application/json" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H "x-ingest-token: $INGEST_TOKEN" \
            --data-binary @"$RUNNER_TEMP/out/latest.json" "$WORKER_URL/ingest/latest.json"

      - name: Publish to sensorpush-data branch
        if: ${{ vars.WORKER_URL == '' }}
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b sensorpush-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -q -m "SensorPush data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sensorpush-data
